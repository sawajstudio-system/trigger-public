name: Add New Real Platforms

on:
  workflow_dispatch:

jobs:
  add_platforms:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN_GITHUB }}
          fetch-depth: 0

      - name: 2. Create Folders
        run: |
          mkdir -p Firent/service_url/translator
          mkdir -p Firent/service_url/voice
          mkdir -p Firent/service_url/background
          mkdir -p Firent/service_url/islamic

      - name: 3. Create Translator Files
        run: |
          cat << 'EOF' > Firent/service_url/translator/translators_lib_test.py
import sys, os
sys.path.append(os.path.abspath(os.path.join(os.path.dirname(__file__), '../..')))
from service_api.integrations.telegram_helper import send_telegram_message
def run_test():
    try:
        import translators as ts
        result = ts.translate_text("Hello world", translator='bing', from_language='en', to_language='hi')
        send_telegram_message(f"✅ Translators Lib (Real): {result}")
    except ImportError: send_telegram_message("⚠️ Translators lib not installed")
    except Exception as e: send_telegram_message(f"❌ Error: {e}")
if __name__ == "__main__": run_test()
EOF

      - name: 4. Create Voice Files
        run: |
          cat << 'EOF' > Firent/service_url/voice/kokoro_tts_test.py
import sys, os
sys.path.append(os.path.abspath(os.path.join(os.path.dirname(__file__), '../..')))
from service_api.integrations.telegram_helper import send_telegram_message
def run_test():
    try:
        import kokoro
        send_telegram_message("✅ Kokoro TTS (Real): Library is installed.")
    except ImportError:
        send_telegram_message("⚠️ Kokoro TTS: Not installed")
    except Exception as e:
        send_telegram_message(f"❌ Error: {e}")
if __name__ == "__main__": run_test()
EOF

      - name: 5. Create Background Files
        run: |
          cat << 'EOF' > Firent/service_url/background/openverse_test.py
import sys, os, requests
sys.path.append(os.path.abspath(os.path.join(os.path.dirname(__file__), '../..')))
from service_api.integrations.telegram_helper import send_telegram_message
def run_test():
    try:
        url = "https://api.openverse.org/v1/images/?q=nature&page_size=1"
        res = requests.get(url, timeout=15)
        if res.status_code == 200:
            data = res.json().get("results", [])
            if data:
                send_telegram_message(f"✅ Openverse: Image Found")
            else:
                send_telegram_message("✅ Openverse: Working")
        else:
            send_telegram_message(f"❌ Openverse Failed: {res.status_code}")
    except Exception as e: send_telegram_message(f"❌ Error: {e}")
if __name__ == "__main__": run_test()
EOF

      - name: 6. Create Islamic Files
        run: |
          cat << 'EOF' > Firent/service_url/islamic/quran_unified_test.py
import sys, os
sys.path.append(os.path.abspath(os.path.join(os.path.dirname(__file__), '../..')))
from service_api.integrations.telegram_helper import send_telegram_message
def run_test():
    try:
        import quran_unified
        send_telegram_message("✅ Quran Unified: Library installed")
    except ImportError:
        send_telegram_message("⚠️ Quran Unified: Not installed")
    except Exception as e:
        send_telegram_message(f"❌ Error: {e}")
if __name__ == "__main__": run_test()
EOF

      - name: 7. Commit and Push
        run: |
          git config --global user.name "Platform Bot"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Added new real platforms safely" || echo "No changes"
          git push origin HEAD:${{ github.ref_name }}
