name: Clean Wrong Folder

on:
  workflow_dispatch:

jobs:
  clean:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN_GITHUB }}
          fetch-depth: 0

      - name: 2. Delete Wrong Firent Folder
        run: |
          echo "🗑️ Deleting wrong Firent/Firent folder..."
          rm -rf Firent/Firent
          echo "✅ Deleted!"

      - name: 3. Commit and Push
        run: |
          git config --global user.name "Cleanup Bot"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Cleanup: Removed wrong double Firent folder" || echo "No changes"
          git push origin HEAD:${{ github.ref_name }}
