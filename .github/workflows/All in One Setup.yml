name: AI System Builder

on:
  workflow_dispatch:

jobs:
  ai_build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN_GITHUB }}
          fetch-depth: 0

      - name: 2. Run AI System
        run: |
          python "AI System.py"

      - name: 3. Commit and Push
        run: |
          git config --global user.name "AI System Bot"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Feat: AI System generated and verified new URLs" || echo "No changes"
          git push origin HEAD:${{ github.ref_name }}
