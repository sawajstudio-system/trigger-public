name: Universal Master

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Choose task or test to run'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'Git Clean'
          - 'Ripo TXT'
          - 'Ripo ZIP'
          - 'report_only'
          - 'cloudinary_16_test'
          - 'tanvo_17_test'
          - 'magic_14_test'
          - 'media_10_test'
          - 'pixabay_11_test'
          - 'pexels_12_test'
          - 'coverr_13_test'
          - 'telegram_02_test'
          - 'github_03_test'
          - 'gemini_04_test'
          - 'groq_06_test'
          - 'openrouter_05_test'
          - 'nvidia_07_test'
          - 'cloudflare_08_test'
          - 'cohere_09_test'
          - 'anges_15_test'

concurrency:
  group: supercharged-master-${{ github.ref }}-${{ inputs.task }}
  cancel-in-progress: false

jobs:
  master_execution:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: write
      contents: read

    env:
      REPORT_FILE: 'production_report'
      BOT_TOKEN: ${{ secrets.TELEGRAM_API_REPORT_TOKEN }}
      CHAT_ID: ${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}
      TELEGRAM_API_REPORT_TOKEN: ${{ secrets.TELEGRAM_API_REPORT_TOKEN }}
      TELEGRAM_API_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}
      TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
      GH_TOKEN: ${{ secrets.TOKEN_GITHUB }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      ANGES_API_KEY: ${{ secrets.ANGES_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
      MAGICHOUR_API_KEY: ${{ secrets.MAGICHOUR_API_KEY }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      TANVO_API_KEY: ${{ secrets.TANVO_API_KEY }}
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: 'Firent/service_api:Firent/service_api/integrations'

    steps:
      - name: 1. Checkout Firent Repo
        uses: actions/checkout@v4
        with:
          path: 'Firent'
          token: ${{ secrets.TOKEN_GITHUB }}
          fetch-depth: 0

      - name: 2. Checkout Backend Repo
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/Backend'
          path: 'Backend'
          token: ${{ secrets.TOKEN_GITHUB }}
          continue-on-error: true

      - name: 3. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 4. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "requests>=2.31.0,<3.0.0"
          pip install pytest || true

      # ==========================================================
      # 1. TASK: Git Clean (Runs on 'all' OR 'Git Clean')
      # ==========================================================
      - name: 🧹 Run Git Cleanup
        if: |
          github.event.inputs.task == 'all' || 
          github.event.inputs.task == 'Git Clean'
        env:
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          MAX_RUNS: '500'
        run: |
          set -euo pipefail
          FILE=$(find Firent -maxdepth 4 -name "cleanup.py" -path "*Git_clean*" | head -n1)
          [ -n "$FILE" ] || { echo "❌ cleanup.py not found"; exit 1; }
          echo "✅ Running: $FILE"
          python3 "$FILE"

      # ==========================================================
      # 2. TASK: Ripo TXT (Runs on 'all' OR 'Ripo TXT')
      # ==========================================================
      - name: 📄 Run Ripo TXT Generator & Sender
        if: |
          github.event.inputs.task == 'all' || 
          github.event.inputs.task == 'Ripo TXT'
        run: |
          set -euo pipefail
          FILE=$(find Firent -maxdepth 5 -name "Ripo_txt_tg.py" | head -n1)
          [ -n "$FILE" ] || { echo "❌ Ripo_txt_tg.py not found"; exit 1; }
          echo "✅ Running: $FILE"
          python3 "$FILE"

      # ==========================================================
      # 3. TASK: Ripo ZIP (Runs on 'all' OR 'Ripo ZIP')
      # ==========================================================
      - name: 🗜️ Run Ripo ZIP Pack & Sender
        if: |
          github.event.inputs.task == 'all' || 
          github.event.inputs.task == 'Ripo ZIP'
        run: |
          set -euo pipefail
          FILE=$(find Firent -maxdepth 5 -name "Ripo_zip_tg.py" | head -n1)
          [ -n "$FILE" ] || { echo "❌ Ripo_zip_tg.py not found"; exit 1; }
          echo "✅ Running: $FILE"
          python3 "$FILE"

      # ==========================================================
      # 4. TASK: Report Only (Runs on 'all' OR 'report_only')
      # ==========================================================
      - name: 📋 Generate Code Report Only
        if: |
          github.event.inputs.task == 'all' || 
          github.event.inputs.task == 'report_only'
        env:
          REPORT_FILE: 'production_report.txt'
          SCAN_ROOT: '.'
        run: |
          set -euo pipefail
          GEN=$(find Firent -maxdepth 6 -type f -name "Txt ripo generator.py" | head -n1)
          [ -n "$GEN" ] || { echo "❌ generator not found"; exit 1; }
          echo "✅ Generator: $GEN"
          python "$GEN"

          TXT=$(find . -maxdepth 3 -name "production_report.txt" | head -n1)
          [ -n "$TXT" ] || { echo "❌ no report generated"; exit 1; }
          echo "📤 Uploading: $TXT"
          curl -sS --fail-with-body --retry 5 --retry-all-errors \
            -F "chat_id=$TELEGRAM_API_REPORT_CHAT_ID" \
            -F "document=@$TXT" \
            -F "caption=📂 [PRODUCTION] Report: $(basename "$TXT")" \
            "https://api.telegram.org/bot$TELEGRAM_API_REPORT_TOKEN/sendDocument"

      # ==========================================================
      # 5. TASK: AI Tests & Runners (Runs on 'all' OR specific test)
      # ==========================================================
      - name: 🚀 Run AI Tests / Master Runner
        if: |
          github.event.inputs.task != 'Git Clean' &&
          github.event.inputs.task != 'Ripo TXT' &&
          github.event.inputs.task != 'Ripo ZIP' &&
          github.event.inputs.task != 'report_only'
        working-directory: Firent/service_api
        env:
          TARGET: ${{ github.event.inputs.task }}
        run: |
          set -euo pipefail
          echo "🎯 TARGET=$TARGET"
          echo "📁 CWD=$(pwd)"

          if [ "$TARGET" = "all" ]; then
            if [ -f run_all_tests.py ]; then
              echo "🚀 Running master: run_all_tests.py"
              python run_all_tests.py
              exit $?
            fi
            echo "⚠️ run_all_tests.py missing"
            exit 1
          fi

          echo "🔎 Resolving '$TARGET'..."
          STRIPPED="${TARGET%_test}"
          CANDIDATES=$(find . -type f -name "*.py" \( \
              -name "${TARGET}.py" -o \
              -name "*${TARGET}*.py" -o \
              -name "${STRIPPED}.py" -o \
              -name "*${STRIPPED}*.py" \) | sort -u)

          if [ -z "$CANDIDATES" ]; then
            echo "❌ No file matched '$TARGET'."
            echo "::group::Available test files"
            find . -name "*_test.py" | sort
            echo "::endgroup::"
            exit 1
          fi

          echo "::group::Candidates"
          echo "$CANDIDATES"
          echo "::endgroup::"
          FILE=$(echo "$CANDIDATES" | head -n1)
          echo "✅ Selected: $FILE"
          python "$FILE"

      # ==========================================================
      # ARTIFACTS & SUMMARY
      # ==========================================================
      - name: 📦 Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-${{ github.event.inputs.task }}-${{ github.run_id }}
          path: |
            **/*.txt
            **/*.log
            **/*.zip
          retention-days: 7
          if-no-files-found: ignore

      - name: 🧾 Job Summary
        if: always()
        run: |
          {
            echo "## 🚀 Master Run Summary"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Task | \`${{ github.event.inputs.task }}\` |"
            echo "| Status | \`${{ job.status }}\` |"
            echo "| Run ID | \`${{ github.run_id }}\` |"
            echo "| Time | $(date -u +%Y-%m-%dT%H:%M:%SZ) |"
          } >> "$GITHUB_STEP_SUMMARY"
