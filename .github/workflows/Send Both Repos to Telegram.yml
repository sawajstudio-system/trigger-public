name: Send Repos to Telegram Simple

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Firent Repo Download Karein
        uses: actions/checkout@v4
        with:
          path: 'Firent'
          token: ${{ secrets.TOKEN_GITHUB }}

      - name: 2. Backend Repo Download Karein
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/Backend'
          path: 'Backend'
          token: ${{ secrets.TOKEN_GITHUB }}

      - name: 3. Code Combine Karke Telegram Par Bhejein
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_API_REPORT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}
        run: |
          python3 -c '
          import os
          import requests

          output_file = "combined_code.txt"
          folders = ["Firent", "Backend"]
          
          # Jin folders aur files ko skip karna hai
          ignore_dirs = {".git", "node_modules", "venv", "__pycache__", ".github"}
          ignore_exts = {".png", ".jpg", ".jpeg", ".zip", ".pdf", ".txt"}

          print("Code ko ek file mein combine kiya ja raha hai...")
          with open(output_file, "w", encoding="utf-8") as outfile:
              outfile.write("=== FIRENT & BACKEND CODE COMBINED FILE ===\n\n")
              
              for folder in folders:
                  if not os.path.exists(folder):
                      continue
                  for root, dirs, files in os.walk(folder):
                      dirs[:] = [d for d in dirs if d not in ignore_dirs]
                      
                      for file in files:
                          if any(file.endswith(ext) for ext in ignore_exts):
                              continue
                          
                          file_path = os.path.join(root, file)
                          outfile.write(f"\n\n========================================\n")
                          outfile.write(f"FILE: {file_path}\n")
                          outfile.write(f"========================================\n\n")
                          
                          try:
                              with open(file_path, "r", encoding="utf-8", errors="ignore") as infile:
                                  outfile.write(infile.read())
                          except Exception as e:
                              outfile.write(f"[Read Error: {e}]")

          print("Telegram par file bheji ja rahi hai...")
          token = os.environ.get("BOT_TOKEN")
          chat_id = os.environ.get("CHAT_ID")
          url = f"https://api.telegram.org/bot{token}/sendDocument"
          
          with open(output_file, "rb") as f:
              files_payload = {"document": f}
              data_payload = {"chat_id": chat_id, "caption": "📁 Firent & Backend Combined Code TXT"}
              res = requests.post(url, data=data_payload, files=files_payload)
              print("Response:", res.text)
              if res.status_code == 200:
                  print("Successfully sent to Telegram!")
              else:
                  print("Failed to send.")
          '
