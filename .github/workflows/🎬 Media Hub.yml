name: 🎬 Smart Media Hub

on:
  workflow_dispatch:
    inputs:
      execution_target:
        description: 'Kya run karna hai?'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - media_10_test
          - pixabay_11_test
          - pexels_12_test
          - coverr_13_test
          - magic_14_test
          - cloudinary_16_test

permissions:
  contents: read

jobs:
  run_media:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Repos
        uses: actions/checkout@v4
      - name: 📥 Checkout Private
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/code-pvt'
          token: ${{ secrets.TOKEN_GITHUB }}
          path: 'private_source_code'
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: 📦 Install Dependencies
        run: pip install "requests>=2.31.0,<3.0.0"

      - name: 🚀 Run Smart Tests
        working-directory: private_source_code/API
        env:
          TARGET_TEST: ${{ github.event.inputs.execution_target }}
          # Saare API Keys yahan pass karein
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
          MAGICHOUR_API_KEY: ${{ secrets.MAGICHOUR_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          TELEGRAM_API_REPORT_TOKEN: ${{ secrets.TELEGRAM_API_REPORT_TOKEN }}
          TELEGRAM_API_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}
        run: python run_my_tests.py
