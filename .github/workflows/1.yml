name: One-Time Setup (Auto-Rename & Fix Everything)

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN_GITHUB }}
          fetch-depth: 0

      - name: 2. Rename Files (Remove Numbers)
        run: |
          echo "🔄 Removing numbers from test filenames..."
          
          BASE_DIR="Firent/service_api"
          if [ ! -d "$BASE_DIR" ]; then BASE_DIR="service_api"; fi
          
          find $BASE_DIR -type f -name "*_*_test.py" | while read file; do
            dir=$(dirname "$file")
            base=$(basename "$file")
            
            # Regex: XX_test.py -> test.py
            new_base=$(echo "$base" | sed -E 's/_[0-9]+_test\.py/_test.py/')
            
            if [ "$base" != "$new_base" ]; then
              echo "Renaming: $base -> $new_base"
              mv "$file" "$dir/$new_base"
            fi
          done

      - name: 3. Update References Inside Python Files (Imports/Filenames)
        run: |
          echo "🔧 Updating Python code references..."
          
          BASE_DIR="Firent/service_api"
          if [ ! -d "$BASE_DIR" ]; then BASE_DIR="service_api"; fi
          
          # Har python file ke andar jaakar _XX_ ko replace karega
          find $BASE_DIR -type f -name "*.py" | while read file; do
            echo "Checking code in: $file"
            # Yahan regex se saare _04_, _02_, etc. hata rahe hain
            sed -i -E 's/([a-z]+)_[0-9]+_test/\1_test/g' "$file"
            sed -i -E 's/([a-z]+)_[0-9]+_bot/\1_bot/g' "$file"
            sed -i -E 's/([a-z]+)_[0-9]+_token/\1_token/g' "$file"
          done

      - name: 4. Update YML Options & References
        run: |
          echo "📝 Updating Workflow YML files..."
          
          # Saari YML files mein se numbers hata dega
          find Firent/.github/workflows -type f -name "*.yml" | while read file; do
            echo "Updating YML: $file"
            sed -i -E 's/([a-z]+)_[0-9]+_test/\1_test/g' "$file"
            sed -i -E 's/([a-z]+)_[0-9]+_bot/\1_bot/g' "$file"
            sed -i -E 's/([a-z]+)_[0-9]+_token/\1_token/g' "$file"
          done

      - name: 5. Commit and Push Changes
        run: |
          echo "🚀 Pushing changes to GitHub..."
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          
          git add .
          if git diff --staged --quiet; then
            echo "✅ No changes to commit (Already clean)."
          else
            git commit -m "Auto-Setup: Cleaned filenames, updated imports & YML options"
            git push origin HEAD:${{ github.ref_name }}
            echo "✅ Successfully pushed all changes!"
          fi
