name: Universal URL

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Choose URL task or test to run'
        required: true
        default: 'all_url_tests'
        type: choice
        options:
          - 'all_url_tests'
          - 'pollinations_image_test'
          - 'veida_test'
          - 'stable_diffusion_test'
          - 'invokeai_test'
          - 'kavel_test'
          - 'together_flux_test'
          - 'ai_image_editor_test'
          - 'flux_anime_test'
          - 'dalle3_test'
          - 'sd3_test'
          - 'tts_studio_test'
          - 'kokoro_test'
          - 'edge_tts_test'
          - 'wavhost_test'
          - 'mizuoto_test'
          - 'plapre_test'
          - 'phonon_tts_test'
          - 'aloud_test'
          - 'speechma_test'
          - 'readanytext_test'
          - 'phane_test'
          - 'kupkaprod_test'
          - 'chainstreet_test'
          - 'automated_video_gen_test'
          - 'hailuo_local_test'
          - 'pexels_url_test'
          - 'pixabay_url_test'
          - 'mixkit_test'
          - 'coverr_test'
          - 'librestock_test'
          - 'localmind_test'
          - 'aether_test'
          - 'aparte_test'
          - 'twin_o_matic_test'
          - 'dulus_test'
          - 'pollinations_chat_test'
          - 'duck_ai_test'
          - 'askai_test'
          - 'llm_browser_test'
          - 'unee_test'

concurrency:
  group: supercharged-url-${{ github.ref }}-${{ inputs.task }}
  cancel-in-progress: false

jobs:
  url_execution:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read

    env:
      TELEGRAM_API_REPORT_TOKEN: ${{ secrets.TELEGRAM_API_REPORT_TOKEN }}
      TELEGRAM_API_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: 'Firent/service_api:Firent/service_api/integrations:Firent/service_url'

    steps:
      - name: 1. Checkout Firent Repo
        uses: actions/checkout@v4
        with:
          path: 'Firent'
          token: ${{ secrets.TOKEN_GITHUB }}
          fetch-depth: 0

      - name: 2. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "requests>=2.31.0,<3.0.0" pytest || true

      # ==========================================================
      # 1. TASK: Run ALL URL Tests
      # ==========================================================
      - name: 🌍 Run All URL Tests
        if: github.event.inputs.task == 'all_url_tests'
        working-directory: Firent/service_url
        run: |
          python url_tests_runner.py

      # ==========================================================
      # 2. TASK: Run Specific URL Test
      # ==========================================================
      - name: 🎯 Run Specific URL Test
        if: github.event.inputs.task != 'all_url_tests'
        working-directory: Firent/service_url
        env:
          TARGET: ${{ github.event.inputs.task }}
        run: |
          set -euo pipefail
          echo "🎯 TARGET=$TARGET"
          
          FILE=$(find . -type f -name "${TARGET}.py" | head -n1)
          
          if [ -z "$FILE" ]; then
            echo "❌ URL Test file not found: ${TARGET}.py"
            exit 1
          fi
          
          echo "✅ Selected: $FILE"
          python "$FILE"

      - name: 📦 Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: url-run
          path: |
            **/*.txt
            **/*.zip
          retention-days: 7
