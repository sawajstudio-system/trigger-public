name: Delete All Workflow Runs

on:
  workflow_dispatch: # Isse aap GitHub Actions tab se manual ek click mein chala sakte hain

jobs:
  delete-runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete Old Workflow Runs
        env:
          GH_TOKEN: ${{ secrets.TOKEN_GITHUB }}
          REPO: ${{ github.repository }}
        run: |
          echo "Purane workflow runs ki list nikal rahe hain..."
          
          # Saare runs ki list fetch karke ek-ek karke delete karenge 
          # (Current chal rahe run ko chhod kar taaki error na aaye)
          for run_id in $(gh run list --repo "$REPO" --limit 100 --json databaseId --jq '.[].databaseId'); do
            if [ "$run_id" != "${{ github.run_id }}" ]; then
              echo "Deleting run ID: $run_id"
              gh run delete "$run_id" --repo "$REPO"
            else
              echo "Skipping current active run ID: $run_id"
            fi
          done
          
          echo "Sabhi purane workflow runs successfully delete ho chuke hain!"
