name: Final TXT Fixer

on:
  workflow_dispatch:

jobs:
  fix_txt:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN_GITHUB }}
          fetch-depth: 0

      - name: 2. Remove Old Duplicate Files
        run: |
          echo "🗑️ Removing old files..."
          rm -f "Firent/service_api/utils/Txt ripo generator.py"
          rm -f "Firent/system_service/TG_report/Ripo_txt_tg.py"
          echo "✅ Old files removed."

      - name: 3. Copy & Upgrade VIP Generator
        run: |
          echo "📦 Creating single VIP Generator..."
          # Pehle se jo file thi usko copy karke naya code daal rahe hain
          # Isse lamba YAML error kabhi nahi aayega
          
          cat << 'ENDOFCODE' > "Firent/Ripo_txt_tg.py"
import os, sys, datetime, requests

OUTPUT_FILE = "production_report.txt"
TEXT_EXTS = {".py", ".txt", ".yml", ".yaml", ".md", ".json", ".html", ".css", ".js", ".ts", ".sh", ".env", ".sql", ".xml"}
SKIP_DIRS = {".git", "__pycache__", "node_modules", ".venv", "venv", "dist", "build"}

def main():
    all_files = []
    for repo in ["Firent", "Backend"]:
        if os.path.isdir(repo):
            for root, dirs, fs in os.walk(repo):
                dirs[:] = [d for d in dirs if d not in SKIP_DIRS]
                for f in fs:
                    p = os.path.join(root, f)
                    if os.path.splitext(p)[1].lower() in TEXT_EXTS:
                        all_files.append((os.path.normpath(p), p))

    with open(OUTPUT_FILE, "w", encoding="utf-8") as f:
        f.write("╔══════════════════════════════════════════════════════════╗\n")
        f.write("║       👑 VIP PRODUCTION REPORT 👑                        ║\n")
        f.write("╚══════════════════════════════════════════════════════════╝\n\n")
        f.write(f"Total Files: {len(all_files)}\n\n")
        
        for full, disp in all_files:
            try:
                f.write(f"\n{'='*60}\n📄 FILE: {disp}\n{'='*60}\n")
                with open(full, "r", encoding="utf-8", errors="ignore") as src:
                    for i, line in enumerate(src.read().split("\n"), 1):
                        f.write(f"{i:03d} | {line}\n")
            except: pass

    token = os.environ.get("BOT_TOKEN")
    chat_id = os.environ.get("CHAT_ID")
    if token and chat_id:
        url = f"https://api.telegram.org/bot{token}/sendDocument"
        with open(OUTPUT_FILE, "rb") as f:
            requests.post(url, data={"chat_id": chat_id, "caption": "👑 VIP Report"}, files={"document": f})
        print("✅ Sent to Telegram!")

if __name__ == "__main__":
    main()
ENDOFCODE
          echo "✅ Created successfully."

      - name: 4. Update Workflow Path
        run: |
          echo "📝 Updating workflow..."
          # Sed ka use bina kisi syntax error ke
          sed -i "s|service_api/utils/Txt ripo generator.py|Ripo_txt_tg.py|g" "Firent/.github/workflows/universal_master.yml"
          sed -i "s|system_service/TG_report/Ripo_txt_tg.py|Ripo_txt_tg.py|g" "Firent/.github/workflows/universal_master.yml"
          echo "✅ Workflow updated."

      - name: 5. Commit and Push
        run: |
          git config --global user.name "Fixer Bot"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Fix: Single Root VIP TXT Generator" || echo "No changes"
          git push origin HEAD:${{ github.ref_name }}
