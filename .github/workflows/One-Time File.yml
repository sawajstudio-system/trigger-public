name: 1Time Fixer

on:
  workflow_dispatch:

jobs:
  run_setup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN_GITHUB }}
          fetch-depth: 0

      - name: 2. Run 1time.py
        run: |
          python 1time.py

      - name: 3. Delete Setup Files & Commit
        run: |
          rm -f 1time.py
          rm -f .github/workflows/1time.yml
          
          git config --global user.name "Fixer Bot"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Auto-Fix: Fixed Paths and removed duplicates" || echo "No changes"
          git push origin HEAD:${{ github.ref_name }}
