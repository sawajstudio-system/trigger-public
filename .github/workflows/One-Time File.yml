name: Auto Rename 03 File

on:
  workflow_dispatch:

jobs:
  fix_number:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN_GITHUB }}
          fetch-depth: 0

      - name: 2. Rename File Automatically
        run: |
          echo "🔄 Renaming file..."
          OLD_FILE="Firent/service_api/utils/github_03_token_test.py"
          NEW_FILE="Firent/service_api/utils/github_token_test.py"
          
          if [ -f "$OLD_FILE" ]; then
            git mv "$OLD_FILE" "$NEW_FILE"
            echo "✅ File successfully renamed to github_token_test.py"
          else
            echo "⚠️ File not found, maybe already renamed."
          fi

      - name: 3. Update Universal Master YML
        run: |
          echo "📝 Updating YML..."
          YML_FILE="Firent/.github/workflows/universal_master.yml"
          
          if [ -f "$YML_FILE" ]; then
            # Replaces the old option name with the new one
            sed -i 's/github_03_token_test/github_token_test/g' "$YML_FILE"
            echo "✅ YML updated!"
          fi

      - name: 4. Commit and Push
        run: |
          git config --global user.name "Fixer Bot"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Auto-Rename: github_03_token_test to github_token_test" || echo "No changes"
          git push origin HEAD:${{ github.ref_name }}
