name: Final Fixer

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN_GITHUB }}
          fetch-depth: 0

      - name: 2. Delete Old Files
        run: |
          echo "🗑️ Deleting old files..."
          rm -f "Firent/service_api/utils/Txt ripo generator.py"
          rm -f "Firent/service_api/utils/github_03_token_test.py"
          rm -f "Firent/.github/workflows/One-Time File.yml"
          rm -f "Firent/.github/workflows/One-Time.yml"
          echo "✅ Old files removed."

      - name: 3. Create New VIP Generator
        run: |
          echo "📦 Creating VIP Generator..."
          # Hum direct bash ki command se file bana rahe hain, YML mein lamba code nahi likh rahe
          touch "Firent/system_service/TG_report/Ripo_txt_tg.py"
          echo "# VIP Generator" > "Firent/system_service/TG_report/Ripo_txt_tg.py"
          echo "import os, sys, requests" >> "Firent/system_service/TG_report/Ripo_txt_tg.py"
          echo "OUTPUT_FILE = 'production_report.txt'" >> "Firent/system_service/TG_report/Ripo_txt_tg.py"
          echo "SKIP_DIRS = {'.git', '__pycache__', 'node_modules'}" >> "Firent/system_service/TG_report/Ripo_txt_tg.py"
          echo "TEXT_EXTS = {'.py', '.txt', '.yml', '.yaml', '.md', '.json', '.css', '.js', '.sh'}" >> "Firent/system_service/TG_report/Ripo_txt_tg.py"
          echo "files = []" >> "Firent/system_service/TG_report/Ripo_txt_tg.py"
          echo "for repo in ['Firent', 'Backend']:" >> "Firent/system_service/TG_report/Ripo_txt_tg.py"
          echo "    for root, dirs, fs in os.walk(repo):" >> "Firent/system_service/TG_report/Ripo_txt_tg.py"
          echo "        dirs[:] = [d for d in dirs if d not in SKIP_DIRS]" >> "Firent/system_service/TG_report/Ripo_txt_tg.py"
          echo "        for f in fs:" >> "Firent/system_service/TG_report/Ripo_txt_tg.py"
          echo "            p = os.path.join(root, f)" >> "Firent/system_service/TG_report/Ripo_txt_tg.py"
          echo "            if os.path.splitext(p)[1].lower() in TEXT_EXTS: files.append((p,p))" >> "Firent/system_service/TG_report/Ripo_txt_tg.py"
          echo "with open(OUTPUT_FILE, 'w', encoding='utf-8') as f:" >> "Firent/system_service/TG_report/Ripo_txt_tg.py"
          echo "    f.write('👑 VIP PRODUCTION REPORT\n\n')" >> "Firent/system_service/TG_report/Ripo_txt_tg.py"
          echo "    for _, p in files:" >> "Firent/system_service/TG_report/Ripo_txt_tg.py"
          echo "        try:" >> "Firent/system_service/TG_report/Ripo_txt_tg.py"
          echo "            f.write('\n'+'='*60+'\nFILE: '+p+'\n'+'='*60+'\n')" >> "Firent/system_service/TG_report/Ripo_txt_tg.py"
          echo "            f.write(open(p, 'r', encoding='utf-8', errors='ignore').read())" >> "Firent/system_service/TG_report/Ripo_txt_tg.py"
          echo "        except: pass" >> "Firent/system_service/TG_report/Ripo_txt_tg.py"
          echo "t = os.environ.get('BOT_TOKEN'); c = os.environ.get('CHAT_ID')" >> "Firent/system_service/TG_report/Ripo_txt_tg.py"
          echo "if t and c:" >> "Firent/system_service/TG_report/Ripo_txt_tg.py"
          echo "    requests.post(f'https://api.telegram.org/bot{t}/sendDocument', data={'chat_id': c}, files={'document': open(OUTPUT_FILE, 'rb')})" >> "Firent/system_service/TG_report/Ripo_txt_tg.py"
          echo "✅ Created successfully."

      - name: 4. Update YML Path
        run: |
          echo "📝 Updating path..."
          sed -i 's|FILE="Firent/Ripo_txt_tg.py"|FILE="Firent/system_service/TG_report/Ripo_txt_tg.py"|g' "Firent/.github/workflows/🌐universal_master.yml"
          echo "✅ Path updated."

      - name: 5. Commit and Push
        run: |
          git config --global user.name "Fixer Bot"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Final Fix: Removed duplicates and set correct paths" || echo "No changes"
          git push origin HEAD:${{ github.ref_name }}
