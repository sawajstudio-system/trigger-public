name: Ultimate One-Time Production Fixer

on:
  workflow_dispatch:

jobs:
  fix_all:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN_GITHUB }}
          fetch-depth: 0

      - name: 2. Delete Duplicate & Unwanted Files
        run: |
          echo "🗑️ Deleting duplicates..."
          rm -f "Firent/system_service/TG_report/Ripo_txt_tg.py"
          rm -f "Firent/service_api/run_my_tests.py"
          rm -f "Firent/.github/workflows/📝_TG.yml"
          rm -f "Firent/service_api/utils/Txt ripo generator.py" # Moved to system_service
          echo "✅ Duplicates removed."

      - name: 3. Clean Comments & Format Code
        run: |
          echo "🧹 Cleaning comments across all files..."
          
          find Firent -type f \( -name "*.py" -o -name "*.yml" \) | while read file; do
            echo "Cleaning: $file"
            
            # 1. Remove pure comment lines (except shebang and coding)
            sed -i -E '/^\s*#/ { /^#!/! { /coding[:=]/! d } }' "$file"
            # 2. Remove inline comments (naive, but effective for single line cleanup)
            sed -i -E 's/[[:space:]]+#.*$//g' "$file"
            # 3. Remove empty lines
            sed -i '/^$/d' "$file"
            # 4. Remove multiple blank lines
            cat -s "$file" > "${file}.tmp" && mv "${file}.tmp" "$file"
            
            # 5. Add a single-line header comment to python files
            if [[ "$file" == *.py ]]; then
              filename=$(basename "$file")
              sed -i "1s|^|# $filename - Production Ready\n|" "$file"
            fi
          done
          
          echo "✅ Comments cleaned and files formatted."

      - name: 4. Commit and Push Changes
        run: |
          git config --global user.name "Production Bot"
          git config --global user.email "actions@github.com"
          
          git add .
          if git diff --staged --quiet; then
            echo "✅ No changes to commit."
          else
            git commit -m "Production Ready: Cleaned all comments, removed duplicates, and optimized all files"
            git push origin HEAD:${{ github.ref_name }}
            echo "✅ Successfully pushed!"
          fi
