name: Final Cleanup

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN_GITHUB }}
          fetch-depth: 0

      - name: 2. Delete Duplicates
        run: |
          echo "🗑️ Deleting old files..."
          rm -f "Firent/service_api/utils/Txt ripo generator.py"
          rm -f "Firent/service_api/utils/github_03_token_test.py"
          rm -f "Firent/.github/workflows/One-Time File.yml"
          rm -f "Firent/.github/workflows/One-Time.yml"
          echo "✅ Old duplicates removed."

      - name: 3. Fix system_service/Ripo_txt_tg.py (VIP Generator)
        run: |
          echo "📝 Writing new VIP Report Generator in system_service..."
          cat << 'ENDOFCODE' > "Firent/system_service/TG_report/Ripo_txt_tg.py"
import os, sys, datetime, requests

sys.path.insert(0, os.path.dirname(os.path.abspath(__file__)))
try:
    from TG_sender import send_document, build_caption
except ImportError:
    def send_document(*args, **kwargs): pass
    def build_caption(*args, **kwargs): return "VIP Report"

OUTPUT_FILE = "production_report.txt"
TEXT_EXTS = {".py", ".txt", ".yml", ".yaml", ".md", ".json", ".html", ".css", ".js", ".ts", ".sh", ".env", ".sql", ".xml"}
SKIP_DIRS = {".git", "__pycache__", "node_modules", ".venv", "venv", "dist", "build"}

def main():
    all_files = []
    for repo in ["Firent", "Backend"]:
        if os.path.isdir(repo):
            for root, dirs, fs in os.walk(repo):
                dirs[:] = [d for d in dirs if d not in SKIP_DIRS]
                for f in fs:
                    p = os.path.join(root, f)
                    if os.path.splitext(p)[1].lower() in TEXT_EXTS:
                        all_files.append((os.path.normpath(p), p))

    with open(OUTPUT_FILE, "w", encoding="utf-8") as f:
        f.write("╔══════════════════════════════════════════════════════════╗\n")
        f.write("║       👑 VIP PRODUCTION REPORT 👑                        ║\n")
        f.write("╚══════════════════════════════════════════════════════════╝\n\n")
        f.write(f"Total Files: {len(all_files)}\n\n")
        
        for full, disp in all_files:
            try:
                f.write(f"\n{'='*60}\n📄 FILE: {disp}\n{'='*60}\n")
                with open(full, "r", encoding="utf-8", errors="ignore") as src:
                    for i, line in enumerate(src.read().split("\n"), 1):
                        f.write(f"{i:03d} | {line}\n")
            except: pass

    token = os.environ.get("BOT_TOKEN")
    chat_id = os.environ.get("CHAT_ID")
    if token and chat_id:
        url = f"https://api.telegram.org/bot{token}/sendDocument"
        with open(OUTPUT_FILE, "rb") as f:
            requests.post(url, data={"chat_id": chat_id, "caption": "👑 VIP Report"}, files={"document": f})
        print("✅ Sent to Telegram!")

if __name__ == "__main__":
    main()
ENDOFCODE
          echo "✅ VIP Generator created successfully."

      - name: 4. Update Universal Master YML
        run: |
          echo "📝 Updating universal_master.yml..."
          # Yahan hum sahi path set kar rahe hain
          sed -i 's|FILE="Firent/Ripo_txt_tg.py"|FILE="Firent/system_service/TG_report/Ripo_txt_tg.py"|g' "Firent/.github/workflows/🌐universal_master.yml"
          echo "✅ YML updated."

      - name: 5. Commit and Push
        run: |
          git config --global user.name "Fixer Bot"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Final cleanup: Removed duplicates & fixed paths" || echo "No changes"
          git push origin HEAD:${{ github.ref_name }}
