name: Final Fixer

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN_GITHUB }}
          fetch-depth: 0

      - name: 2. Delete Old Duplicate Files
        run: |
          echo "🗑️ Deleting old files..."
          rm -f "Firent/service_api/utils/Txt ripo generator.py"
          rm -f "Firent/service_api/utils/github_03_token_test.py"
          rm -f "Firent/.github/workflows/One-Time File.yml"
          rm -f "Firent/.github/workflows/One-Time.yml"
          echo "✅ Old files removed."

      - name: 3. Download Fresh VIP Generator from Raw Link
        run: |
          echo "📦 Downloading fresh VIP Generator..."
          mkdir -p "Firent/system_service/TG_report"
          
          # Yahan hum direct raw link se file download kar rahe hain
          curl -sL "https://raw.githubusercontent.com/sawajstudio-system/Backend/main/Ripo_txt_tg.py" -o "Firent/system_service/TG_report/Ripo_txt_tg.py"
          
          # Verify karte hain ki file download hui ya nahi
          if [ -s "Firent/system_service/TG_report/Ripo_txt_tg.py" ]; then
            echo "✅ File downloaded successfully."
          else
            echo "❌ Download failed or file is empty."
            exit 1
          fi

      - name: 4. Update Path in Workflow
        run: |
          echo "📝 Updating path..."
          sed -i 's|FILE="Firent/Ripo_txt_tg.py"|FILE="Firent/system_service/TG_report/Ripo_txt_tg.py"|g' "Firent/.github/workflows/🌐universal_master.yml"
          echo "✅ Path updated."

      - name: 5. Commit and Push
        run: |
          git config --global user.name "Fixer Bot"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Final Fix: Downloaded VIP Generator from raw link" || echo "No changes"
          git push origin HEAD:${{ github.ref_name }}
