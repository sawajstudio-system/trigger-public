name: Rename 03 File

on:
  workflow_dispatch:

jobs:
  rename_file:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN_GITHUB }}
          fetch-depth: 0

      - name: 2. Rename File (Remove _03_)
        run: |
          echo "🔄 Renaming file to remove '03'..."
          
          OLD_FILE="Firent/service_api/utils/github_03_token_test.py"
          NEW_FILE="Firent/service_api/utils/github_token_test.py"
          
          if [ -f "$OLD_FILE" ]; then
            git mv "$OLD_FILE" "$NEW_FILE"
            echo "✅ File renamed successfully to $NEW_FILE"
          else
            echo "⚠️ File not found. Maybe already renamed."
          fi

      - name: 3. Update Universal Master YML
        run: |
          echo "📝 Updating workflow references..."
          # Universal Master YML mein option ka naam bhi update karna
          YML_FILE="Firent/.github/workflows/universal_master.yml"
          
          if [ -f "$YML_FILE" ]; then
            sed -i 's/github_03_token_test/github_token_test/g' "$YML_FILE"
            echo "✅ YML updated."
          fi

      - name: 4. Commit and Push
        run: |
          git config --global user.name "Rename Bot"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Renamed github_03_token_test.py to github_token_test.py" || echo "No changes"
          git push origin HEAD:${{ github.ref_name }}
