name: Fix Telegram Imports & Master YML

on:
  workflow_dispatch:

jobs:
  fix_imports:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN_GITHUB }}
          fetch-depth: 0

      - name: 2. Fix Imports in All Python Files
        run: |
          echo "🔍 Searching and replacing imports..."
          # Saari python files dhoondh kar import theek kar rahe hain
          find Firent -name "*.py" -type f -exec sed -i 's/telegram_01_helper/telegram_helper/g' {} +
          echo "✅ Imports updated in all files."

      - name: 3. Update universal_master.yml
        run: |
          echo "📝 Updating workflow options..."
          YML_FILE="Firent/.github/workflows/universal_master.yml"
          
          if [ -f "$YML_FILE" ]; then
            # YML mein option ka naam theek kar rahe hain
            sed -i 's/telegram_02_bot_test/telegram_bot_test/g' "$YML_FILE"
            echo "✅ YML option updated."
          else
            echo "⚠️ universal_master.yml not found."
          fi

      - name: 4. Commit and Push
        run: |
          git config --global user.name "Fixer Bot"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Fix: Updated telegram_helper imports and YML options" || echo "No changes"
          git push origin HEAD:${{ github.ref_name }}
