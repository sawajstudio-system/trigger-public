name: Run  URLs

on:
  workflow_dispatch:

jobs:
  run_urls:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read

    env:
      TELEGRAM_API_REPORT_TOKEN: ${{ secrets.TELEGRAM_API_REPORT_TOKEN }}
      TELEGRAM_API_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: 'Firent/service_api:Firent/service_api/integrations:Firent/service_url'

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN_GITHUB }}
          fetch-depth: 0

      - name: 2. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 4. Run All Tests in A-Z Folders & Send Report
        working-directory: Firent/service_url
        run: |
          python3 - << 'PYEOF'
import os, sys, subprocess, requests

def send_report(passed, failed):
    token = os.getenv("TELEGRAM_API_REPORT_TOKEN")
    chat_id = os.getenv("TELEGRAM_API_REPORT_CHAT_ID")
    if not token or not chat_id: return

    msg = "🌍 <b>[URL RUNNER REPORT]</b>\n"
    msg += "━━━━━━━━━━━━━━━━━━━━━━━━━━\n"
    if passed:
        msg += "✅ <b>PASSED:</b>\n"
        for p in passed: msg += f"  ✔️ {p}\n"
    if failed:
        msg += "\n❌ <b>FAILED:</b>\n"
        for f in failed: msg += f"  ❌ {f}\n"
    msg += f"\n📊 <b>TOTAL:</b> {len(passed) + len(failed)} | ✅ {len(passed)} | ❌ {len(failed)}"
    
    try:
        requests.post(f"https://api.telegram.org/bot{token}/sendMessage", json={"chat_id": chat_id, "text": msg, "parse_mode": "HTML"}, timeout=15)
    except: pass

def run_all():
    tests = []
    # Saare folders (A-Z) mein jao aur files dhoondho
    for root, dirs, files in os.walk("."):
        for f in files:
            if f.endswith(".py") and not f.startswith("__"):
                tests.append(os.path.join(root, f))

    if not tests:
        print("⚠️ No test files found.")
        return

    passed, failed = [], []
    
    my_env = os.environ.copy()
    my_env["PYTHONPATH"] = f"{os.getcwd()}/../service_api:{os.getcwd()}/../service_api/integrations"
    
    for t in tests:
        print(f"▶️ Running: {t}")
        res = subprocess.run([sys.executable, t], env=my_env)
        if res.returncode == 0: passed.append(t)
        else: failed.append(t)
        
    send_report(passed, failed)

if __name__ == "__main__":
    run_all()
PYEOF
