name: One-Time Service URL Setup

on:
  workflow_dispatch:

jobs:
  setup_service_url:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN_GITHUB }}
          fetch-depth: 0

      - name: 2. Create Folders & Write Files
        run: |
          echo "🚀 Creating service_url structure..."
          mkdir -p Firent/service_url/image
          mkdir -p Firent/service_url/audio
          mkdir -p Firent/service_url/video
          mkdir -p Firent/service_url/ai_chat

          # ==========================================
          # 🖼️ IMAGE GENERATION FILES
          # ==========================================
          cat << 'EOF' > Firent/service_url/image/pollinations_test.py
import sys, os, requests
sys.path.append(os.path.abspath(os.path.join(os.path.dirname(__file__), '../..')))
from service_api.integrations.telegram_helper import send_telegram_message
def run_test():
    try:
        res = requests.get("https://image.pollinations.ai/prompt/cyberpunk%20city", timeout=60)
        send_telegram_message(f"✅ Pollinations: Status {res.status_code}")
    except Exception as e: send_telegram_message(f"❌ Pollinations Error: {e}")
if __name__ == "__main__": run_test()
EOF

          cat << 'EOF' > Firent/service_url/image/veida_test.py
import sys, os
sys.path.append(os.path.abspath(os.path.join(os.path.dirname(__file__), '../..')))
from service_api.integrations.telegram_helper import send_telegram_message
def run_test():
    try:
        import veida
        send_telegram_message("✅ Veida Library: Found (Run manually to generate)")
    except ImportError: send_telegram_message("❌ Veida: Not installed (pip install veida)")
if __name__ == "__main__": run_test()
EOF

          cat << 'EOF' > Firent/service_url/image/stable_diffusion_test.py
