          # ==========================================
          echo "# LocalMind Placeholder" > Firent/service_url/ai_chat/localmind_test.py
          echo "# Aether Placeholder" > Firent/service_url/ai_chat/aether_test.py
          echo "# Aparte Placeholder" > Firent/service_url/ai_chat/aparte_test.py
          echo "# Twin Placeholder" > Firent/service_url/ai_chat/twin_o_matic_test.py
          echo "# Dulus Placeholder" > Firent/service_url/ai_chat/dulus_test.py
          
          cat << 'EOF' > Firent/service_url/ai_chat/pollinations_chat_test.py
import sys, os, requests
sys.path.append(os.path.abspath(os.path.join(os.path.dirname(__file__), '../..')))
from service_api.integrations.telegram_helper import send_telegram_message
def run_test():
    try:
        res = requests.get("https://text.pollinations.ai/Hello", timeout=15)
        send_telegram_message(f"✅ Pollinations Chat: {res.text[:50]}")
    except Exception as e: send_telegram_message(f"❌ Chat Error: {e}")
if __name__ == "__main__": run_test()
EOF
          
          echo "# Duck AI Placeholder" > Firent/service_url/ai_chat/duck_ai_test.py
          echo "# AskAI Placeholder" > Firent/service_url/ai_chat/askai_test.py
          echo "# LLM Browser Placeholder" > Firent/service_url/ai_chat/llm_browser_test.py
          echo "# Unee Placeholder" > Firent/service_url/ai_chat/unee_test.py

          echo "✅ All 40 files created."

      - name: 3. Commit and Push
        run: |
          git config --global user.name "Setup Bot"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Setup: Created service_url folder with 40 platform files" || echo "No changes"
          git push origin HEAD:${{ github.ref_name }}
