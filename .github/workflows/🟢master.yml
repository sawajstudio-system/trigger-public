name: 👨‍🔬🧪 Production Master Hub

on:
  workflow_dispatch:
    inputs:
      execution_target:
        description: 'Kya run karna hai?'
        required: true
        default: 'all'
        type: choice
        options:
          - all              # Saari APIs + Media + Pixabay + Pexels
          - report_only      # Sirf Code Report
          - telegram_test    # 02 - Telegram
          - github_test      # 03 - GitHub
          - gemini_test      # 04 - Gemini
          - groq_test        # 05 - Groq
          - openrouter_test  # 06 - OpenRouter
          - nvidia_test      # 07 - NVIDIA
          - cloudflare_test  # 08 - Cloudflare
          - cohere_test      # 09 - Cohere
          - media_test       # 10 - Media Generator
          - pixabay_test     # 11 - Pixabay
          - pexels_test      # 12 - Pexels (NAYA)

permissions:
  contents: read

jobs:
  production_pipeline:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    env:
      REPORT_FILE: 'production_report'

    steps:
      # ... (Checkout aur Setup Python wale steps waisa hi rakhein) ...

      # ... (02 se 11 tak ke API tests yahan aayenge) ...

      - name: 🧪 12 - Pexels Video Test
        if: |
          github.event.inputs.execution_target == 'all' ||
          github.event.inputs.execution_target == 'pexels_test'
        working-directory: private_source_code/API
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_API_REPORT_TOKEN: ${{ secrets.TELEGRAM_API_REPORT_TOKEN }}
          TELEGRAM_API_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}
        run: python pexels_12_test.py
