name: Universal Master

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Choose task or test to run'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'Git Clean'
          - 'Ripo ZIP'
          - 'report_only'
          - 'cloudinary_test'
          - 'tanvo_test'
          - 'magic_test'
          - 'media_test'
          - 'pixabay_test'
          - 'pexels_test'
          - 'coverr_test'
          - 'telegram_02_bot_test'
          - 'github_token_test'          # <-- Yahan se 03 hata diya hai
          - 'gemini_test'
          - 'groq_test'
          - 'openrouter_test'
          - 'nvidia_test'
          - 'cloudflare_test'
          - 'cohere_test'
          - 'anges_test'

concurrency:
  group: supercharged-master-${{ github.ref }}-${{ inputs.task }}
  cancel-in-progress: false

jobs:
  master_execution:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: write
      contents: read

    env:
      REPORT_FILE: 'production_report.txt'
      BOT_TOKEN: ${{ secrets.TELEGRAM_API_REPORT_TOKEN }}
      CHAT_ID: ${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}
      TELEGRAM_API_REPORT_TOKEN: ${{ secrets.TELEGRAM_API_REPORT_TOKEN }}
      TELEGRAM_API_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}
      TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
      GH_TOKEN: ${{ secrets.TOKEN_GITHUB }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      ANGES_API_KEY: ${{ secrets.ANGES_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
      MAGICHOUR_API_KEY: ${{ secrets.MAGICHOUR_API_KEY }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      TANVO_API_KEY: ${{ secrets.TANVO_API_KEY }}
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: 'Firent/service_api:Firent/service_api/integrations'

    steps:
      - name: 1. Checkout Firent Repo
        uses: actions/checkout@v4
        with:
          path: 'Firent'
          token: ${{ secrets.TOKEN_GITHUB }}
          fetch-depth: 0

      - name: 2. Checkout Backend Repo
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/Backend'
          path: 'Backend'
          token: ${{ secrets.TOKEN_GITHUB }}
          continue-on-error: true

      - name: 3. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 4. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "requests>=2.31.0,<3.0.0" pytest || true

      # ==========================================================
      # 1. TASK: Git Clean
      # ==========================================================
      - name: 🧹 Run Git Cleanup
        if: |
          github.event.inputs.task == 'all' || 
          github.event.inputs.task == 'Git Clean'
        env:
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          MAX_RUNS: '500'
        run: |
          set -euo pipefail
          FILE=$(find Firent/system_service -maxdepth 2 -name "cleanup.py" | head -n1)
          if [ -n "$FILE" ]; then
            python3 "$FILE"
            echo "SYS_CLEAN_STATUS=✅ Success" >> $GITHUB_ENV
          else
            echo "SYS_CLEAN_STATUS=❌ Not Found" >> $GITHUB_ENV
            exit 1
          fi

      # ==========================================================
      # 2. TASK: Ripo ZIP
      # ==========================================================
      - name: 🗜️ Run Ripo ZIP Pack
        if: |
          github.event.inputs.task == 'all' || 
          github.event.inputs.task == 'Ripo ZIP'
        run: |
          set -euo pipefail
          FILE=$(find Firent/system_service/TG_report -maxdepth 2 -name "Ripo_zip_tg.py" | head -n1)
          if [ -n "$FILE" ]; then
            python3 "$FILE"
            echo "SYS_ZIP_STATUS=✅ Sent" >> $GITHUB_ENV
          else
            echo "SYS_ZIP_STATUS=❌ Missing" >> $GITHUB_ENV
            exit 1
          fi

      # ==========================================================
      # 3. TASK: VIP Report (From system_service)
      # ==========================================================
      - name: 📋 Generate VIP Report
        if: |
          github.event.inputs.task == 'all' || 
          github.event.inputs.task == 'report_only'
        run: |
          set -euo pipefail
          FILE="Firent/system_service/TG_report/Ripo_txt_tg.py"
          if [ -f "$FILE" ]; then
            echo "✅ Running VIP Generator: $FILE"
            python3 "$FILE"
            echo "SYS_REPORT_STATUS=✅ Sent" >> $GITHUB_ENV
          else
            echo "❌ VIP Generator not found at $FILE"
            exit 1
          fi

      # ==========================================================
      # 4. TASK: AI Tests
      # ==========================================================
      - name: 🚀 Run AI Tests / Master Runner
        if: |
          github.event.inputs.task != 'Git Clean' &&
          github.event.inputs.task != 'Ripo ZIP' &&
          github.event.inputs.task != 'report_only'
        working-directory: Firent/service_api
        env:
          TARGET: ${{ github.event.inputs.task }}
          SYS_CLEAN_STATUS: ${{ env.SYS_CLEAN_STATUS }}
          SYS_TXT_STATUS: ${{ env.SYS_REPORT_STATUS }}
          SYS_ZIP_STATUS: ${{ env.SYS_ZIP_STATUS }}
        run: |
          set -euo pipefail
          echo "🎯 TARGET=$TARGET"
          
          if [ "$TARGET" = "all" ]; then
            python run_all_tests.py
            exit $?
          fi

          STRIPPED="${TARGET%_test}"
          CANDIDATES=$(find . -type f -name "*.py" \( \
              -name "${TARGET}.py" -o \
              -name "*${TARGET}*.py" -o \
              -name "${STRIPPED}.py" -o \
              -name "*${STRIPPED}.py" \) | sort -u)

          if [ -z "$CANDIDATES" ]; then
            echo "❌ No file matched '$TARGET'."
            exit 1
          fi
          FILE=$(echo "$CANDIDATES" | head -n1)
          python "$FILE"

      - name: 📦 Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-run
          path: |
            **/*.txt
            **/*.zip
          retention-days: 7
