name: Clean Wrong Folders

on:
  workflow_dispatch:

jobs:
  clean:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN_GITHUB }}
          fetch-depth: 0

      - name: 2. Delete Wrong Folders & Files
        run: |
          echo "🗑️ Deleting wrong Firent/Firent folder..."
          rm -rf Firent/Firent
          
          echo "🗑️ Deleting wrong service_url/O folder..."
          rm -rf service_url/O
          
          echo "🗑️ Deleting temporary ai_script.py..."
          rm -f ai_script.py
          
          echo "✅ Cleanup Done!"

      - name: 3. Commit and Push
        run: |
          git config --global user.name "Cleanup Bot"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Cleanup: Removed wrong folders and temporary files" || echo "No changes"
          git push origin HEAD:${{ github.ref_name }
