name: 👨‍🔬🧪 Production Master Hub

on:
  workflow_dispatch:
    inputs:
      execution_target:
        description: 'Kya run karna hai?'
        required: true
        default: 'all'
        type: choice
        options:
          - all              # Saari APIs ek sath run hongi
          - report_only      # Sirf Code Report banegi
          - telegram_test    # 02 - Telegram
          - github_test      # 03 - GitHub
          - gemini_test      # 04 - Gemini
          - groq_test        # 05 - Groq
          - openrouter_test  # 06 - OpenRouter
          - nvidia_test      # 07 - NVIDIA
          - cloudflare_test  # 08 - Cloudflare
          - huggingface_test # 09 - Hugging Face (NAYA)

permissions:
  contents: read

jobs:
  production_pipeline:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    env:
      REPORT_FILE: 'production_report'

    steps:
      # ... (Checkout aur Setup Python wale steps waisa hi rakhein) ...

      # =======================================================================
      # REPORT GENERATOR
      # =======================================================================
      - name: 📋 Generate Full Code Report & Send
        if: |
          github.event.inputs.execution_target == 'all' ||
          github.event.inputs.execution_target == 'report_only'
        env:
          TELEGRAM_API_REPORT_TOKEN: ${{ secrets.TELEGRAM_API_REPORT_TOKEN }}
          TELEGRAM_API_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}
        run: |
          python "private_source_code/API/Txt ripo generator.py"
          mv private_source_code/API/*.txt ./ || true
          for file in *.txt; do
            if [ -f "$file" ]; then
              curl -sS --fail-with-body --retry 3 -F "chat_id=$TELEGRAM_API_REPORT_CHAT_ID" \
                   -F "document=@$file" \
                   -F "caption=📂 [PRODUCTION] Code Report: $file" \
                   "https://api.telegram.org/bot$TELEGRAM_API_REPORT_TOKEN/sendDocument"
            fi
          done

      # ... (Telegram, Github, Gemini, Groq, OpenRouter, NVIDIA, Cloudflare wale steps waisa hi rakhein) ...

      - name: 🧪 09 - Hugging Face Smoke Test
        if: |
          github.event.inputs.execution_target == 'all' ||
          github.event.inputs.execution_target == 'huggingface_test'
        working-directory: private_source_code/API
        env:
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          TELEGRAM_API_REPORT_TOKEN: ${{ secrets.TELEGRAM_API_REPORT_TOKEN }}
          TELEGRAM_API_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}
        run: python huggingface_09_test.py
