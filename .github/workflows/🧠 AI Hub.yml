name: 👑 VIP Master Production Hub

on:
  workflow_dispatch:
    inputs:
      execution_target:
        description: 'Kya run karna hai?'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - report_only
          - telegram_02_test
          - github_03_test
          - gemini_04_test
          - groq_06_test
          - openrouter_05_test
          - nvidia_07_test
          - cloudflare_08_test
          - cohere_09_test
          - anges_15_test
          - media_10_test
          - pixabay_11_test
          - pexels_12_test
          - coverr_13_test
          - magic_14_test
          - cloudinary_16_test

permissions:
  contents: read

jobs:
  production_pipeline:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    env:
      REPORT_FILE: 'production_report'
      TELEGRAM_API_REPORT_TOKEN: ${{ secrets.TELEGRAM_API_REPORT_TOKEN }}
      TELEGRAM_API_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}
      TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      ANGES_API_KEY: ${{ secrets.ANGES_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
      MAGICHOUR_API_KEY: ${{ secrets.MAGICHOUR_API_KEY }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

    steps:
      - name: 📥 Checkout Public Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: 📥 Checkout Private Repository (code-pvt)
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/code-pvt'
          token: ${{ secrets.TOKEN_GITHUB }}
          path: 'private_source_code'
          fetch-depth: 1
          persist-credentials: false

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install Dependencies
        run: pip install "requests>=2.31.0,<3.0.0"

      # =======================================================================
      # REPORT GENERATOR
      # =======================================================================
      - name: 📋 Generate Full Code Report & Send
        if: |
          github.event.inputs.execution_target == 'all' ||
          github.event.inputs.execution_target == 'report_only'
        run: |
          python "private_source_code/API/Txt ripo generator.py"
          mv private_source_code/API/*.txt ./ || true
          for file in *.txt; do
            if [ -f "$file" ]; then
              curl -sS --fail-with-body --retry 3 -F "chat_id=$TELEGRAM_API_REPORT_CHAT_ID" \
                   -F "document=@$file" -F "caption=📂 [PRODUCTION] Report: $file" \
                   "https://api.telegram.org/bot$TELEGRAM_API_REPORT_TOKEN/sendDocument"
            fi
          done

      # =======================================================================
      # SMART TEST RUNNER
      # =======================================================================
      - name: 🚀 Run Selected Test(s)
        if: github.event.inputs.execution_target != 'report_only'
        working-directory: private_source_code/API
        env:
          TARGET: ${{ github.event.inputs.execution_target }}
        run: |
          if [ "$TARGET" == "all" ]; then
            # Agar all select hai toh saare tests run karo
            python run_all_tests.py
          else
            # Exact file dhoondhna jo dropdown mein select hui hai
            FILE="${TARGET}.py"
            if [ -f "$FILE" ]; then
              echo "✅ Found file: $FILE"
              python "$FILE"
            else
              echo "❌ Error: '$FILE' nahi mili! Folder check karein."
              exit 1
            fi
          fi
