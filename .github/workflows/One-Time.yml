name: Copy API Folder to Public Repo

on:
  workflow_dispatch: # Manual trigger

jobs:
  copy-api-folder:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Push karne ki permission

    steps:
      - name: 1. Public Repo (Firent) Checkout Karein
        uses: actions/checkout@v4
        with:
          path: 'Firent'
          token: ${{ secrets.TOKEN_GITHUB }}
          persist-credentials: true
          fetch-depth: 0

      - name: 2. Private Repo (Backend) Checkout Karein
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/Backend'
          path: 'Backend'
          token: ${{ secrets.TOKEN_GITHUB }}

      - name: 3. Security Check (Kya API folder mila?)
        run: |
          echo "=== Backend API Folder Check ==="
          if [ -d "Backend/API" ]; then
            echo "✅ API folder mil gaya!"
            ls -la Backend/API/
          else
            echo "❌ ERROR: Backend mein 'API' folder nahi mila!"
            exit 1
          fi

      - name: 4. API Folder ko Firent mein Copy Karein
        run: |
          echo "Copying folder..."
          rm -rf Firent/API
          cp -r Backend/API Firent/API
          echo "✅ Copy ho gaya!"

      - name: 5. Main Branch par Direct Push Karein
        run: |
          cd Firent
          
          # Git Setup
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          
          # Changes add karein
          git add API/
          
          # Check karein ki koi badlav hai ya nahi
          if git diff --cached --quiet; then
            echo "⚠️ API folder mein koi naya badlav nahi hai."
          else
            git commit -m "Auto-imported API folder from Backend [skip ci]"
            echo "🚀 Pushing to main branch..."
            git push origin main
            echo "🎉 Success! API folder main branch par successfully chala gaya."
          fi
          
